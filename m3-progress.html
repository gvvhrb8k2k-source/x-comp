<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!-- منع التخزين المؤقت (Cache) لضمان ظهور التعديلات فوراً -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M3 Linear Progress - Official Material Web Motion</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #121212;
    }

    /* 1. الحاوية الرئيسية للمسار (Track) */
    .m3-linear-progress {
      position: relative;
      width: 320px;
      height: 4px;
      border-radius: 2px;
      background-color: #333333;
      overflow: hidden;
      transform: translateZ(0); /* تفعيل التسريع الرسومي للعنصر */
    }

    /* 2. شريط التخزين المؤقت (Buffer) باستخدام scaleX */
    .m3-linear-progress__buffer {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      left: 0;
      background-color: rgba(255, 255, 255, 0.25);
      border-radius: 2px;
      transform-origin: right; /* لأن الواجهة RTL، يبدأ التمدد من اليمين لليسار */
      transform: scaleX(0);    /* القيمة تبدأ من 0 إلى 1 */
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 3. شريط التقدم النشط (Active Indicator) باستخدام scaleX الرسمي */
    .m3-linear-progress__active-indicator {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      left: 0;
      background-color: #D0BCFF; /* لون M3 Primary */
      border-radius: 2px;
      transform-origin: right;
      transform: scaleX(0);    /* القيمة تتغير هنا باحترافية */
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 4. نقطة النهاية (Stop Indicator) */
    .m3-linear-progress__stop-indicator {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: #666666;
    }
  </style>
</head>
<body>

  <div class="m3-linear-progress" role="progressbar">
    <div class="m3-linear-progress__buffer" id="bufferBar"></div>
    <div class="m3-linear-progress__active-indicator" id="activeBar"></div>
    <div class="m3-linear-progress__stop-indicator"></div>
  </div>

  <script>
    // المحاكاة البرمجية باستخدام قيم الـ scaleX (من 0.0 إلى 1.0) بدلاً من النسبة المئوية
    const activeBar = document.getElementById('activeBar');
    const bufferBar = document.getElementById('bufferBar');

    let progress = 0.0;
    let buffer = 0.0;

    setInterval(() => {
      if (progress <= 1.0) {
        // تطبيق مقياس scaleX بدقة مطابقة لمكتبة Material Web
        activeBar.style.transform = `scaleX(${progress})`;
        buffer = Math.min(progress + 0.3, 1.0);
        bufferBar.style.transform = `scaleX(${buffer})`;
        
        progress += 0.01;
      } else {
        progress = 0.0;
        buffer = 0.0;
      }
    }, 50);
  </script>
</body>
</html>
