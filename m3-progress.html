<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M3 Linear Progress Indicator - Step 2</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #121212;
    }

    /* 1. الحاوية الرئيسية */
    .m3-linear-progress {
      position: relative;
      width: 320px;
      height: 4px;
      border-radius: 2px;
      background-color: #333333; /* Track الخلفي */
      overflow: hidden;
    }

    /* 2. شريط التخزين المؤقت (Buffer Indicator) */
    .m3-linear-progress__buffer {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      width: 0%;
      background-color: rgba(255, 255, 255, 0.25); /* لون شفاف يوضح التحميل */
      border-radius: 2px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 3. شريط التقدم النشط (Active Indicator مع حركة أندرويد) */
    .m3-linear-progress__active-indicator {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      width: 0%;
      background-color: #D0BCFF; /* لون M3 Primary افتراضي */
      border-radius: 2px;
      /* استخدام منحنى الحركة القياسي في أندرويد */
      transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 4. نقطة النهاية (Stop Indicator) */
    .m3-linear-progress__stop-indicator {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: #666666;
    }
  </style>
</head>
<body>

  <div class="m3-linear-progress" role="progressbar">
    <div class="m3-linear-progress__buffer" id="bufferBar"></div>
    <div class="m3-linear-progress__active-indicator" id="activeBar"></div>
    <div class="m3-linear-progress__stop-indicator"></div>
  </div>

  <script>
    // محاكاة تفاعلية للتحقق من سلاسة حركة أندرويد
    const activeBar = document.getElementById('activeBar');
    const bufferBar = document.getElementById('bufferBar');

    let progress = 0;
    let buffer = 0;

    setInterval(() => {
      if (progress <= 100) {
        activeBar.style.width = progress + '%';
        buffer = Math.min(progress + 25, 100);
        bufferBar.style.width = buffer + '%';
        progress += 1;
      } else {
        progress = 0;
        buffer = 0;
      }
    }, 100);
  </script>
</body>
</html>
